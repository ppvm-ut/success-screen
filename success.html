<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Экран успеха</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Onest:wght@400;500;600&display=swap">
<style>

/* Layout: one centered phone (375×812) on a quiet stage; page chrome only around it. */
:root {
  --stage: #e9ebef;
  --stage-fg: #3b3f47;
  --stage-muted: #6b717c;
  --stage-btn: #ffffff;
  --stage-line: rgba(10, 10, 15, 0.12);
  /* Tokens from the Figma file (app light theme) */
  --content-primary: #0a0a0f;
  --content-secondary: #464a52;
  --content-tertiary: #5e636c;
  --content-success: #007245;
  --content-error: #ad0c1c;
  --fill-subtle: rgba(0, 0, 0, 0.03);
  --fill-default: rgba(0, 0, 0, 0.06);
  --fill-selected: #ffffff;
  --seg-bg: #f7f7f7;
  --card-bg: #f7f8fa;
  --layer: #ffffff;
  --accent: #0365e3;
  --border-accent: #1677ff;
  --border-default: #898f99;
  --border-success: #00915c;
  --border-error: #dc494f;
  --overlay: rgba(0, 0, 0, 0.5);
  --handle: rgba(255, 255, 255, 0.8);
  --white: #ffffff;
  --white-2: rgba(255, 255, 255, 0.8);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font-onest: "Onest", "Inter", system-ui, -apple-system, sans-serif;
  --font-inter: "Inter", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #15171b; --stage-fg: #d9dce2; --stage-muted: #9097a3; --stage-btn: #23262c; --stage-line: rgba(255,255,255,0.14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #15171b; --stage-fg: #d9dce2; --stage-muted: #9097a3; --stage-btn: #23262c; --stage-line: rgba(255,255,255,0.14);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--stage);
  color: var(--stage-fg);
  font-family: var(--font-inter);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.stage { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 100%; }
.stage-bar { width: 100%; max-width: 375px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stage-title { font: 600 14px/20px var(--font-onest); margin: 0; }
.stage-title span { display: block; font: 400 12px/16px var(--font-inter); color: var(--stage-muted); }
.restart {
  font: 500 13px/20px var(--font-inter); color: var(--stage-fg); background: var(--stage-btn);
  border: 1px solid var(--stage-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; white-space: nowrap;
}
.restart:focus-visible { outline: 2px solid var(--border-accent); outline-offset: 2px; }

.phone-wrap { width: calc(375px * var(--s, 1)); height: calc(812px * var(--s, 1)); max-width: 100%; flex: none; }
.phone {
  width: 375px; height: 812px; position: relative; overflow: hidden; background: var(--layer);
  border-radius: 44px; box-shadow: 0 0 0 1px var(--stage-line), 0 24px 60px rgba(0,0,0,0.18);
  transform: scale(var(--s, 1)); transform-origin: top left;
  font-family: var(--font-onest); color: var(--content-primary);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
:where(.phone button) { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
.phone button:focus-visible, .phone [tabindex]:focus-visible { outline: 2px solid var(--border-accent); outline-offset: 2px; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--layer); will-change: transform; }
.hot { position: absolute; border-radius: 26px; }

/* Home: rendered from the Figma frame «Главная с картой» */
#home { background: #f5f6f7; }
#home img { width: 375px; height: 812px; display: block; max-width: none; }

.sysbar { position: relative; height: 87px; flex: none; }
.sysbar svg { display: block; }

/* Nav: Top Bar 56 */
.nav { height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 8px; box-sizing: border-box; }
.nav-side { width: 40px; height: 40px; flex: none; }
.nav-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; }
.nav-title { margin: 0; font: 600 18px/24px var(--font-onest); text-align: center; width: 100%; }
.nav-sub { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; }
.nav-sub span { font: 400 12px/16px var(--font-inter); color: var(--content-tertiary); white-space: nowrap; }
.nav-sub svg { display: block; flex: none; }

/* Content */
.content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 16px; box-sizing: border-box; }
.amount-field { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.amount { margin: 0; width: 100%; text-align: center; font: 600 40px/48px var(--font-onest); letter-spacing: -0.02em; color: var(--content-primary); white-space: nowrap; transition: color .2s; }
.amount.is-zero { color: var(--content-secondary); }
.hint-row { display: flex; justify-content: center; width: 100%; }
.hint { margin: 0; font: 400 14px/20px var(--font-onest); color: var(--content-secondary); white-space: nowrap; transition: color .2s; }
.hint.is-error { color: var(--content-error); }
.promo-slot { height: 40px; display: flex; justify-content: center; }
.promo-btn { height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; }
.promo-btn span { font: 500 16px/20px var(--font-onest); color: var(--content-secondary); white-space: nowrap; }
.promo-btn svg { display: block; }

/* TMP / Chip */
.chip { height: 40px; display: inline-flex; align-items: center; gap: 4px; padding: 0 16px; border-radius: 9999px; background: var(--fill-subtle); flex: none; box-sizing: border-box; transition: background-color .2s; }
.chip span { font: 500 14px/20px var(--font-inter); color: var(--content-primary); white-space: nowrap; transition: color .2s; }
.chip.is-on { background: var(--accent); }
.chip.is-on span { color: var(--white); }
.chip svg { display: block; flex: none; }

/* quick-amounts row */
.quick { height: 40px; display: flex; overflow-x: auto; overflow-y: hidden; margin-right: -16px; padding-right: 16px; scrollbar-width: none; scroll-behavior: smooth; }
.quick::-webkit-scrollbar { display: none; }
.seg-wrap { position: sticky; left: 0; z-index: 2; flex: none; width: 112px; box-sizing: border-box; padding-right: 8px; background: var(--layer); }
.seg-wrap::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: 10px; background: linear-gradient(90deg, var(--layer), rgba(255,255,255,0)); pointer-events: none; }
.seg { position: relative; width: 104px; box-sizing: border-box; display: flex; padding: 4px; border-radius: 9999px; background: var(--seg-bg); }
.seg-thumb { position: absolute; top: 4px; left: 4px; width: 48px; height: 32px; border-radius: 9999px; background: var(--fill-selected); transition: transform .25s var(--ease); }
.seg.is-rub .seg-thumb { transform: translateX(48px); }
.seg button { position: relative; flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 9999px; font: 500 14px/20px var(--font-inter); color: var(--content-secondary); transition: color .2s; }
.seg button[aria-pressed="true"] { color: var(--content-primary); }
.chips { display: flex; gap: 4px; flex: none; }

/* Keypad panel */
.panel { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 0; background: var(--fill-subtle); border-radius: 32px 32px 0 0; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 343px; }
.key { height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: var(--fill-subtle); font: 500 16px/20px var(--font-onest); color: var(--content-primary); transition: background-color .12s, transform .12s; }
.key:active { background: var(--fill-default); transform: scale(.97); }
.key svg { display: block; }

/* TMP / Button */
.cta { height: 56px; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; box-sizing: border-box; border-radius: 16px; background: var(--accent); transition: transform .12s; flex: none; }
.cta:active { transform: scale(.98); }
.cta-title { font: 500 18px/24px var(--font-onest); color: var(--white); white-space: nowrap; }
.cta-sub { font: 400 14px/20px var(--font-onest); color: var(--white-2); white-space: nowrap; }
.homeind { height: 34px; flex: none; }
.homeind svg { display: block; }

/* Bottom sheets */
.sheet-layer { position: absolute; inset: 0; z-index: 10; }
.scrim { position: absolute; inset: 0; background: var(--overlay); opacity: 0; transition: opacity .25s ease; }
.sheet-stack { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; transform: translateY(100%); transition: transform .32s var(--ease); }
.sheet-layer.is-open .scrim { opacity: 1; }
.sheet-layer.is-open .sheet-stack { transform: none; }
.handle { width: 32px; height: 4px; border-radius: 9999px; background: var(--handle); flex: none; }
.sheet-body { width: 100%; display: flex; flex-direction: column; background: var(--layer); border-radius: 24px 24px 0 0; }
.sheet { padding: 24px 16px 16px; display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; }
.sheet-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.sheet-title { margin: 0; font: 600 20px/28px var(--font-onest); letter-spacing: -0.1px; color: var(--content-primary); }
.sheet-sub { margin: 0; font: 400 16px/20px var(--font-onest); color: var(--content-tertiary); }
.icon-btn { width: 24px; height: 24px; flex: none; display: block; }
.icon-btn svg { display: block; }

/* Input */
.input { display: flex; flex-direction: column; gap: 4px; }
.field { height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-radius: 16px; background: var(--fill-default); border: 2px solid transparent; cursor: text; transition: border-color .2s; }
.field.is-focus { border-color: var(--border-accent); }
.field.is-success { border-color: var(--border-success); }
.field.is-error { border-color: var(--border-error); }
.field-input {
  flex: 1; min-width: 0; height: 24px; border: 0; outline: 0; background: transparent; padding: 0; margin: 0;
  font: 400 18px/24px var(--font-onest); color: var(--content-primary); caret-color: var(--accent);
  user-select: text; -webkit-user-select: text; text-transform: uppercase;
}
.field-input::placeholder { color: var(--content-tertiary); text-transform: none; opacity: 1; }
.field-hint { margin: 0; font: 400 14px/20px var(--font-onest); animation: fadeIn .2s ease; }
.field-hint.is-success { color: var(--content-success); font-weight: 500; }
.field-hint.is-error { color: var(--content-error); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

/* Sheet foot: home indicator ↔ iOS keyboard */
.sheet-foot { position: relative; height: 34px; overflow: hidden; transition: height .3s var(--ease); }
.sheet-foot.kb-on { height: 307px; }
.sheet-foot .homeind { position: absolute; left: 0; bottom: 0; transition: opacity .2s; }
.sheet-foot.kb-on .homeind { opacity: 0; }
.kb { position: absolute; left: 0; top: 0; width: 375px; height: 307px; transform: translateY(60px); opacity: 0; transition: transform .3s var(--ease), opacity .2s; pointer-events: none; }
.sheet-foot.kb-on .kb { transform: none; opacity: 1; pointer-events: auto; }
.kb img { display: block; width: 375px; height: 307px; max-width: none; }
.kb button { position: absolute; border-radius: 6px; }
.kb button:active { background: rgba(0,0,0,0.1); }

/* Card picker */
.cards { display: flex; flex-direction: column; gap: 8px; }
.card-opt { width: 343px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 20px; background: var(--card-bg); border: 2px solid transparent; text-align: left; transition: border-color .2s; }
.card-opt.is-on { border-color: var(--border-accent); }
.card-cover { width: 74px; height: 48px; border-radius: 8px; overflow: hidden; flex: none; display: block; }
.card-cover img { width: 74px; height: 48px; display: block; max-width: none; }
.card-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.card-title { font: 500 16px/20px var(--font-onest); color: var(--content-primary); }
.card-sub { font: 400 14px/20px var(--font-onest); color: var(--content-secondary); }
.radio { width: 20px; height: 20px; flex: none; position: relative; }
.radio::before { content: ""; position: absolute; inset: 0; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--border-default); transition: border-color .2s; }
.radio::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .2s var(--ease); }
.card-opt.is-on .radio::before { border-color: var(--accent); }
.card-opt.is-on .radio::after { transform: scale(1); }

/* Done */
.done-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 16px; }
.done-title { margin: 0; font: 600 40px/48px var(--font-onest); letter-spacing: -0.02em; text-align: center; text-wrap: balance; color: var(--content-primary); }
.done-foot { padding: 16px 16px 0; flex: none; }

@media (prefers-reduced-motion: reduce) {
  .scrim, .sheet-stack, .key, .sheet-foot, .kb, .seg-thumb, .chip, .field, .radio::after { transition: none !important; }
  .field-hint { animation: none; }
  .quick { scroll-behavior: auto; }
}

/* success: loader → check */
.sx { background: var(--white); }
.sx-content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding: 16px 16px 0; box-sizing: border-box; }
.sx-hero { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-top: 16px; }
.sx-status { position: relative; width: 64px; height: 64px; flex: none; }
.sx-status svg { position: relative; display: block; }
.sx-halo { position: absolute; inset: 0; border-radius: 50%; background: rgba(22,119,255,0.08); transform: scale(.4); opacity: 0; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s; }
.sx.is-morph .sx-halo { transform: none; opacity: 1; transition-delay: .2s; }
.sx-dot { opacity: 0; }
.sx.is-check .sx-dot { opacity: 1; }
.sx-check { stroke-dasharray: 1; stroke-dashoffset: 1; }
.sx.is-check .sx-check { stroke-dashoffset: 0; transition: stroke-dashoffset .3s ease-out; }
.sx-amount { width: 100%; display: flex; flex-direction: column; gap: 4px; text-align: center; }
.sx-value { margin: 0; font: 600 40px/48px var(--font-onest); letter-spacing: -0.02em; color: var(--content-primary); white-space: nowrap; }
.sx-caption { margin: 0; font: 400 16px/20px var(--font-onest); color: var(--content-secondary); }
.sx-receipt { flex: none; display: flex; flex-direction: column; padding: 4px 12px; border-radius: 20px; background: var(--fill-subtle); }
.sx-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 4px; font: 400 14px/20px var(--font-onest); color: var(--content-secondary); }
.sx-val { display: inline-flex; gap: 4px; font-weight: 500; color: var(--content-primary); white-space: nowrap; }
.sx-old { color: var(--content-tertiary); }
.sx-footer { flex: none; display: flex; flex-direction: column; gap: 8px; padding: 16px 16px 0; }
.sx-btn { height: 56px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; border-radius: 16px; font: 500 18px/24px var(--font-onest); white-space: nowrap; }
.sx-btn svg { display: block; flex: none; }
.sx-btn--soft { background: var(--lf-card); color: var(--content-primary); cursor: default; }
.sx-btn--dark { background: var(--lf-dark); color: var(--white); transition: transform .12s; }
.sx-btn--dark:active { transform: scale(.98); }
.sx-homeind { background: var(--fill-subtle); }
.sx-reveal { transition: opacity .36s ease, transform .42s cubic-bezier(.2,.8,.2,1); }
.sx.is-loading .sx-reveal { opacity: 0; transform: translateY(12px); }
.sx.is-loading.is-shown .sx-reveal { opacity: 1; transform: none; }
.sx-orb { position: absolute; left: 147.5px; top: 408.5px; width: 80px; height: 80px; z-index: 3; pointer-events: none; transform-origin: 50% 50%; }
.sx-orb svg { display: block; overflow: visible; }
.lg-piece { stroke: #0365E3; stroke-width: 0; stroke-linejoin: round; transform-origin: 40px 40px; }
.lg-solid { opacity: 0; }
/* ---------- Atlas Neue tokens (Light) ---------- */
.phone {
  --a-layer: #ffffff; --a-primary: #0a0a0f; --a-secondary: #464a52; --a-tertiary: #5e636c;
  --a-accent: #0365e3; --a-accent-subtle: rgba(22,119,255,0.08); --a-neutral-subtle: rgba(0,0,0,0.03); --a-divider: #eef0f3;
}
.screen { background: var(--a-layer); }
.homeind { flex: none; background: var(--a-layer); }
/* trigger screen */
.st-content { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px 16px 0; box-sizing: border-box; }
.st-hint { flex: 1; display: flex; align-items: center; justify-content: center; margin: 0; padding: 0 24px; text-align: center; font: 400 16px/20px var(--font-onest); color: var(--a-tertiary); }
/* Button · Primary · 56 */
.a-btn { width: 100%; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 24px; border: 0; border-radius: 16px; background: var(--a-accent); color: #fff; font: 500 18px/24px var(--font-onest); white-space: nowrap; cursor: pointer; transition: transform .12s; }
.a-btn:active { transform: scale(.98); }
/* success — layout from the frame «Перевод / Успех» */
.sx-content { padding: 16px 16px 0; gap: 0; justify-content: flex-start; }
.sx-hero { padding-top: 16px; gap: 12px; }
.sx-status { width: 64px; height: 64px; }
.sx-halo { background: var(--a-accent-subtle); }
.sx-amount { gap: 4px; }
.sx-value { font: 600 40px/48px var(--font-onest); letter-spacing: -0.02em; color: var(--a-primary); }
.sx-caption { font: 400 16px/20px var(--font-onest); color: var(--a-secondary); }
.sx-body { flex: none; display: flex; flex-direction: column; gap: 12px; }
.sx-receipt { display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 16px; background: var(--a-neutral-subtle); }
.sx-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0; font: 400 14px/20px var(--font-onest); color: var(--a-secondary); }
.sx-val { display: inline-flex; gap: 4px; font: 500 14px/20px var(--font-onest); color: var(--a-primary); white-space: nowrap; }
.sx-old { color: var(--a-tertiary); }
.sx-divider { height: 16px; display: flex; align-items: center; }
.sx-divider::before { content: ""; display: block; width: 100%; height: 1px; background: var(--a-divider); }
/* softer easing for the success sequence (as in the prototype) */
.sx-halo { transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .35s ease-out; }
.sx.is-morph .sx-halo { transition-delay: .18s; }
.sx.is-check .sx-check { transition: stroke-dashoffset .34s cubic-bezier(.65,0,.35,1); }
.sx-reveal { transition: opacity .4s ease-out, transform .5s cubic-bezier(.16,1,.3,1); }
</style>
<style>body{margin:0}</style>
</head>
<body>


<div class="stage">
  <div class="phone-wrap" id="wrap"><div class="phone" id="phone">
    <section class="screen" data-s="start" aria-label="Перевод">
      <div class="sysbar"><svg width="375" height="87" viewBox="0 0 375 87" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<rect opacity="0.35" x="313.832" y="22.834" width="21" height="10.3333" rx="2.16667" stroke="black"/>

  function stopSuccess() {
    seq++; running.forEach(function (a) { try { a.cancel(); } catch (e) {} }); running = [];
    done.classList.remove("is-morph", "is-check", "is-shown"); done.classList.add("is-loading"); orb.style.visibility = "";
  }
  // success sequence — unchanged: the planet appears segment by segment, gathers into a circle, flies to the status and turns into the check
  function success() {
    stopSuccess(); var my = seq;
    go("done", "fwd");
    if (reduce) { done.classList.remove("is-loading"); done.classList.add("is-morph", "is-check", "is-shown"); orb.style.visibility = "hidden"; return; }
    var ORDER = [2, 1, 3, 0], START = 238, STEP = 110;
    ORDER.forEach(function (idx, k) {
      A(pieces[idx], [{ opacity: 0, transform: "scale(.8)" }, { opacity: 1, transform: "none" }], { duration: 420, delay: START + k * STEP, easing: "cubic-bezier(.33,1,.68,1)" });
    });
    pieces.forEach(function (p) { A(p, [{ strokeWidth: 0 }, { strokeWidth: 9 }], { duration: 260, delay: 898, easing: "cubic-bezier(.32,0,.67,0)" }); });
    A(solid, [{ opacity: 0 }, { opacity: 1 }], { duration: 180, delay: 978, easing: "cubic-bezier(.32,0,.67,0)" });
    wait(1178).then(function () {
      if (my !== seq) return;
      var dx = status.offsetLeft + 32 - (orb.offsetLeft + 40), dy = status.offsetTop + 32 - (orb.offsetTop + 40);
      var p = status.offsetParent; while (p && p !== done) { dx += p.offsetLeft; dy += p.offsetTop; p = p.offsetParent; }
      done.classList.add("is-morph");
      return A(orb, [{ transform: "none" }, { transform: "translate(" + dx + "px," + dy + "px) scale(" + (DISC / 80) + ")" }], { duration: 520, easing: "cubic-bezier(.5,0,.2,1)" }).finished;
    }).then(function () { if (my !== seq) return; orb.style.visibility = "hidden"; done.classList.add("is-check"); return wait(200); })
      .then(function () { if (my !== seq) return; done.classList.add("is-shown"); });
  }

  phone.addEventListener("click", function (e) {
    var a = e.target.closest("[data-act]"); if (!a) return;
    if (a.dataset.act === "go" && cur === "start") success();
    else if (a.dataset.act === "back" && cur === "done") go("start", "back", stopSuccess);
  });

  function fit() {
    var w = document.documentElement.clientWidth - 32, h = window.innerHeight - 32;
    var s = Math.min(1, w / 375, Math.max(h, 400) / 812);
    document.documentElement.style.setProperty("--s", String(Math.max(0.4, s)));
  }
  window.addEventListener("resize", fit); fit();
})();
